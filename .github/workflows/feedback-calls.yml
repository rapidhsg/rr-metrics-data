name: feedback-calls

# Every morning Mon-Sat, load yesterday's quoted appointments that didn't sign into GHL for Kelly's feedback calls.
# Monday also loads Saturday and Sunday. See scripts/feedback_calls.mjs.
# Runs at 8:37 AM Eastern all year: GitHub schedules are UTC, so it fires at 12:37 and 13:37 UTC and the script
# skips the run that lands before 8 AM Eastern. A second run on the same day finds nothing new and does nothing.

on:
  schedule:
    - cron: "37 12,13 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what it would do, write nothing)"
        type: boolean
        default: true
      date:
        description: "Appointment day to load, YYYY-MM-DD (blank = yesterday)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: feedback-calls
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest AccuLynx data
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load feedback calls into GHL
        env:
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
          GHL_FEEDBACK_TOKEN: ${{ secrets.GHL_FEEDBACK_TOKEN }}
          DATA_DIR: databranch/data
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          FC_DATE: ${{ inputs.date }}
        run: node scripts/feedback_calls.mjs

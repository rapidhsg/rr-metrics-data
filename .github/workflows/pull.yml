name: pull-acculynx-reports

# Every hour, grab the newest AccuLynx job export and Revenue In Progress report
# and save them to the "data" branch. The rules on "main" are never touched by this job.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min on odd minutes (GitHub drops many runs at :00/:15/:30/:45). Nothing is saved unless AccuLynx has a new run.
  workflow_dispatch: {}   # manual "Run workflow" button
  push:
    branches: [main]
    paths: [".github/workflows/pull.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the current data branch (empty on the very first run)
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull newest reports from AccuLynx
        id: pull
        env:
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          DATA_DIR: databranch/data
        run: node scripts/pull.mjs

      # Keep only the latest copy on the data branch: one fresh commit each time, so it never grows.
      - name: Save to data branch (latest copy only)
        if: always() && steps.pull.outputs.changed == 'true'
        working-directory: databranch
        run: |
          [ -d .git ] || git init -q
          git config user.name "rr-metrics-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan fresh
          git add -A data
          git commit -q -m "data as of $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fresh:data

      # New data saved: tell the dashboards to rebuild right away (GitHub often skips their own 15-min schedule).
      # Needs repo secret DASHBOARDS_TOKEN (fine-grained token, rapidhsg/dashboard-engine, Actions: read and write).
      # Without it this step just skips and the dashboards fall back to their own schedule.
      - name: Tell the dashboards to refresh
        if: always() && steps.pull.outputs.changed == 'true'
        env:
          DASH_TOKEN: ${{ secrets.DASHBOARDS_TOKEN }}
        run: |
          if [ -z "$DASH_TOKEN" ]; then echo "DASHBOARDS_TOKEN not set, skipping"; exit 0; fi
          curl -sS -f -X POST -H "Authorization: Bearer $DASH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rapidhsg/dashboard-engine/actions/workflows/refresh.yml/dispatches \
            -d '{"ref":"main"}' && echo "dashboards asked to refresh"

name: pull-acculynx-reports

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07
  workflow_dispatch: {}   # manual "Run workflow" button
  push:
    branches: [main]
    paths: [".github/workflows/pull.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull newest reports from AccuLynx
        id: pull
        env:
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
        run: node scripts/pull.mjs

      # Keep only the latest copy: replace history with a single fresh commit so the repo never grows.
      - name: Save (latest copy only)
        if: always() && steps.pull.outputs.changed == 'true'
        run: |
          git config user.name "rr-metrics-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -q -m "data as of $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin fresh:main
